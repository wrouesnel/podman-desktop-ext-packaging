name: Build packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      pd_ref:
        description: 'Podman Desktop ref to build (default: PD_REF of upstream.env)'
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PKG_MAINTAINER: ${{ vars.PKG_MAINTAINER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the application (EL8)
        run: make app ${{ inputs.pd_ref && format('PD_REF={0}', inputs.pd_ref) || '' }}

      - name: Build the packages
        run: make packages

      - name: Test the packages
        run: make test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            out/*.tar.gz
            out/x86_64/*.rpm
            out/*.deb

  release:
    # for tags: build the signed dnf / apt repositories (deployed on GitHub Pages by pages.yml), and attach the
    # packages to the release. The Pages deployment runs in another workflow: GitHub deployments do not progress
    # for refs containing '+' (the +wrouesnel version suffix), a workflow_run deployment runs on the default branch
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: out

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')" >> "$GITHUB_ENV"

      - name: Build the repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_url=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url)
          make repos REPO_BASE_URL="${base_url%/}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: public

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            out/x86_64/*.rpm
            out/*.deb
