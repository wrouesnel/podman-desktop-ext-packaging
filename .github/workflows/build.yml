name: Build packages

# Every push and pull request builds the application and its source packages, and rebuilds and tests the binary
# packages of every target from them, as the build services do. Version tags (v*) also publish: the source
# packages to the Launchpad PPA and COPR, which build the packages, and the application archive to the GitHub
# release (code only: no OS packages are attached to releases).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      pd_ref:
        description: 'Podman Desktop Ext ref to build (default: PD_REF of upstream.env)'
        required: false

permissions:
  contents: read

env:
  PPA: ${{ vars.PPA || 'ppa:w-rouesnel/podman-desktop-ext' }}
  COPR_PROJECT: ${{ vars.COPR_PROJECT || 'wrouesnel/podman-desktop-ext' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PKG_MAINTAINER: ${{ vars.PKG_MAINTAINER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the application (EL8)
        run: make app ${{ inputs.pd_ref && format('PD_REF={0}', inputs.pd_ref) || '' }}

      - name: Build the source packages
        run: make sources

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            out/podman-desktop-ext-*-linux-x64.tar.gz*
            out/srpm/
            out/deb-source/

  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [el8, el10, fedora-43, fedora-44, fedora-45, noble, resolute]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: out

      - name: Rebuild from the source package, install and start (${{ matrix.target }})
        run: make test-${{ matrix.target }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: out

      - name: Check the tag against the application version
        run: |
          archive=out/podman-desktop-ext-${GITHUB_REF_NAME#v}-linux-x64.tar.gz
          [ -f "$archive" ] || { echo "::error::$GITHUB_REF_NAME but no $archive (see PD_REF in upstream.env)"; exit 1; }
          (cd out && sha256sum -c "$(basename "$archive").sha256")

      - name: Install the publishing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends devscripts dput pipx
          pipx install copr-cli

      # the shared Launchpad key, passphrase protected: the passphrase is preset in gpg-agent over stdin (no file,
      # no pinentry on a runner)
      - name: Import the signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_KEY_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_KEY_PASSPHRASE }}
          FPR: ${{ vars.PACKAGE_SIGNING_KEY_FINGERPRINT }}
        run: |
          [ -n "$PACKAGE_SIGNING_KEY" ] && [ -n "$FPR" ] ||
            { echo "::error::PACKAGE_SIGNING_KEY or PACKAGE_SIGNING_KEY_FINGERPRINT is not set"; exit 1; }
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 --import \
            <<<"$PACKAGE_SIGNING_KEY" 3< <(printf '%s' "$PACKAGE_SIGNING_KEY_PASSPHRASE")
          gpg --list-secret-keys "$FPR" >/dev/null
          echo allow-preset-passphrase >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          for grip in $(gpg --with-keygrip --with-colons -K "$FPR" | awk -F: '/^grp/ {print $10}'); do
            /usr/lib/gnupg/gpg-preset-passphrase --preset "$grip" < <(printf '%s' "$PACKAGE_SIGNING_KEY_PASSPHRASE")
          done
          echo "SIGNING_KEY=$FPR" >> "$GITHUB_ENV"

      - name: Upload the source packages to ${{ env.PPA }}
        run: |
          for changes in out/deb-source/*/*_source.changes; do
            debsign --no-re-sign -k"$SIGNING_KEY" "$changes"
            gpg --verify "$changes"
            dput "$PPA" "$changes"
          done

      - name: Build in COPR (${{ env.COPR_PROJECT }})
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          [ -n "$COPR_CONFIG" ] || { echo "::error::The COPR_CONFIG secret is not set"; exit 1; }
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          copr-cli build "$COPR_PROJECT" out/srpm/*.src.rpm

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            out/podman-desktop-ext-*-linux-x64.tar.gz
            out/podman-desktop-ext-*-linux-x64.tar.gz.sha256
          body: |
            Podman Desktop Ext ${{ github.ref_name }}: the compiled application archive (x86_64, glibc 2.28 or newer)
            and its checksum.

            Packages are built by Launchpad and COPR from this archive:

            - Ubuntu 24.04 and 26.04: `sudo add-apt-repository ppa:w-rouesnel/podman-desktop-ext && sudo apt install podman-desktop-ext`
            - RHEL 8 / 10 and Fedora: `sudo dnf copr enable wrouesnel/podman-desktop-ext && sudo dnf install podman-desktop-ext`

            See [Installing](https://github.com/${{ github.repository }}#installing).
